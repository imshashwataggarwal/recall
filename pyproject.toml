[project]
name = "recall"
version = "0.1.0"
description = "Recall — a fully-local, self-evolving personal knowledge base for Copilot (and any agentic CLI) sessions"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Recall contributors" }]
keywords = ["rag", "knowledge-base", "memory", "copilot", "mcp", "ollama", "sqlite-vec", "bm25", "agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "sqlite-vec>=0.1.3",
    "requests>=2.31",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/imshashwataggarwal/recall"
Documentation = "https://github.com/imshashwataggarwal/recall/tree/main/docs"
Repository = "https://github.com/imshashwataggarwal/recall"
Issues = "https://github.com/imshashwataggarwal/recall/issues"

[project.scripts]
recall = "recall.cli:main"
recall-mcp = "recall.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recall"]

[tool.hatch.build.targets.sdist]
include = [
    "src/recall",
    "integrations",
    "docs",
    "scripts",
    "README.md",
    "LICENSE",
    "AGENTS.md",
    "CHANGELOG.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
