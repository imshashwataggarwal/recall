name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (with dev + mcp extras)
        run: python -m pip install --upgrade pip && python -m pip install -e ".[mcp,dev]"

      # Tests use a deterministic FakeEmbedder and an isolated RECALL_HOME,
      # so neither Ollama nor a network connection is required here.
      - name: Run tests
        run: python -m pytest

      - name: CLI smoke test (BM25-only path)
        shell: bash
        run: |
          export RECALL_HOME="$RUNNER_TEMP/.recall-ci"
          recall init
          printf '### Decision   CI smoke entry.' | recall append --workstream ci/test --title smoke --session c1 --body -
          recall search "smoke entry" --workstream ci/test
          recall doctor || true
